<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAP – Carte de veille</title>
<!-- Polices chargées sans bloquer le rendu : media="print" puis bascule à onload. Les piles
     de repli système (voir --display, --body, --mono) s'affichent en attendant. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>
/* Layout : tableau de situation — carte des 6 zones à gauche, fil filtré à droite ; empilé sur téléphone */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#14213a; --muted:#5b6679; --line:#d5dbe3;
  --land:#dfe4ea; --heat1:#c9d6ea; --heat2:#8fa9d3; --heat3:#4f73b3; --heat4:#1f4690;
  --accent:#1f4690; --new:#c2410c; --newbg:#fff1e8; --sea:#f7f9fb;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --panel:#161e2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2a3447;
  --land:#232d40; --heat1:#253c63; --heat2:#2f5594; --heat3:#4b78c4; --heat4:#86a8e6;
  --accent:#86a8e6; --new:#fb9a5b; --newbg:#3a2316; --sea:#121a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --panel:#161e2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2a3447;
  --land:#232d40; --heat1:#253c63; --heat2:#2f5594; --heat3:#4b78c4; --heat4:#86a8e6;
  --accent:#86a8e6; --new:#fb9a5b; --newbg:#3a2316; --sea:#121a28; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{font-weight:500;color:var(--muted);font-size:1.15rem;letter-spacing:.04em;display:block;margin-top:4px;text-transform:uppercase}
.status{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.status b{color:var(--ink);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible,.zone:focus-visible,.reset:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.reset{font:inherit;font-size:.85rem;font-weight:600;background:none;border:none;color:var(--accent);cursor:pointer;padding:5px 4px;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
svg{display:block;width:100%;height:auto}
.zone path.z{fill:var(--land);stroke:var(--bg);stroke-width:.8;transition:fill .2s}
.zone path.m{fill:none;stroke:var(--bg);stroke-width:.4;opacity:.7;pointer-events:none}
.zone{cursor:pointer;outline:none}
.zone[data-h="1"] path.z{fill:var(--heat1)}.zone[data-h="2"] path.z{fill:var(--heat2)}.zone[data-h="3"] path.z{fill:var(--heat3)}.zone[data-h="4"] path.z{fill:var(--heat4)}
.zone:hover path.z{filter:brightness(1.08)}
.zone.sel path.z{stroke:var(--ink);stroke-width:1.6}
.map.hasSel .zone:not(.sel){opacity:.45}
.tag rect{fill:var(--panel);stroke:var(--line)}
.tag text{font-family:var(--display);fill:var(--ink)}
.tag .n{font-weight:700;font-size:17px}.tag .t{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
.tag .nw{fill:var(--new);font-weight:700;font-size:11px}
.tag{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.scale{display:flex;gap:2px}.scale i{width:22px;height:10px;display:block}
.zonelist{display:none;flex-wrap:wrap;gap:6px}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;max-height:720px}
.feedhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.feedhead h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:.02em}
.feedhead p{margin:0;font-size:.82rem;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;overflow-y:auto}
li{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
li:last-child{border-bottom:none}
.badge{align-self:flex-start;font-family:var(--mono);font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--new);background:var(--newbg);padding:1px 6px;border-radius:3px}
li h3{font-size:.98rem;font-weight:600;margin:0;line-height:1.35}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.meta a{color:var(--accent)}
.more{align-items:center}
.empty code{font-family:var(--mono);font-size:.85em}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
footer{font-size:.78rem;color:var(--muted);max-width:75ch}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .zonelist{display:flex}
  .tag .t{display:none}
  .feed{max-height:none}
  h1{font-size:2rem}
  .status{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>MAP<span>Monitoring de l'Actualité Planétaire</span></h1>
    <div class="status">
      <span>Dernière mise à jour : <b id="maj"></b></span>
    </div>
  </header>

  <div class="bar" id="themes"><span class="lbl">Thème</span></div>

  <div class="grid">
    <section class="mapbox" aria-label="Carte des zones">
      <svg class="map" id="map" viewBox="0 0 960 480" role="group" aria-label="Carte du monde par zones, cliquez une zone pour filtrer"></svg>
      <div class="zonelist" id="zonelist"></div>
      <div class="legend">
        <span>Nombre d'informations :</span>
        <span class="scale"><i style="background:var(--land)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i></span>
        <span>peu → beaucoup</span>
        <span style="color:var(--new)" id="legende-nouveau"></span>
      </div>
    </section>

    <section class="feed" aria-live="polite">
      <div class="feedhead">
        <h2 id="ftitle">Toutes les zones</h2>
        <p id="fcount"></p>
      </div>
      <ol id="list"></ol>
    </section>
  </div>

  <footer id="foot">Sources : <span id="srcs"></span>. Seuls le titre, la source, la date et le lien de chaque article sont repris ; l'article complet s'ouvre sur le site du média.</footer>
</div>

<script>
// Aucune donnée dans ce fichier : zones, thèmes, tracé de la carte et actualités viennent de l'API.
const API="api";   // même serveur que la page (voir serveur/app.py)
const PAS=150;
let ZONES=[], THEMES=[], fZone=null, fTheme=null, limite=PAS, requete=0;
const $=s=>document.querySelector(s);
const fmtH=d=>new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const zNom=c=>(ZONES.find(z=>z.code===c)||{nom:c}).nom, tNom=c=>(THEMES.find(t=>t.code===c)||{nom:c}).nom;

async function api(chemin, params={}){
  const q=new URLSearchParams(Object.entries(params).filter(([,v])=>v!=null&&v!==""));
  const r=await fetch(`${API}/${chemin}${q.size?"?"+q:""}`);
  if(!r.ok){let m="HTTP "+r.status;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}
  return r.json();
}

// ---------- construction de la carte à partir du référentiel ----------
const NS="http://www.w3.org/2000/svg", svg=$("#map");
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};

function construire(ref){
  ZONES=ref.zones; THEMES=ref.themes;
  $("#legende-nouveau").textContent=`● Nouveau = ajouté depuis moins de ${ref.duree_nouveau_heures} h`;
  const tags=el("g");
  ZONES.forEach(z=>{
    const g=el("g",{class:"zone",tabindex:"0",role:"button","data-z":z.code},svg);
    el("title",{},g).textContent=z.nom;
    el("path",{class:"z",d:z.d},g);
    if(z.m)el("path",{class:"m",d:z.m},g);
    g.addEventListener("click",()=>setZone(z.code));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setZone(z.code)}});
    const t=el("g",{class:"tag"},tags);
    z.tag={g:t,rect:el("rect",{rx:4,y:-15,height:22},t),n:el("text",{class:"n",y:2},t),t:el("text",{class:"t",y:1},t),nw:el("text",{class:"nw",y:1},t)};
    const b=document.createElement("button");b.className="chip";b.textContent=z.nom;b.dataset.z=z.code;b.onclick=()=>setZone(z.code);$("#zonelist").appendChild(b);
  });
  svg.appendChild(tags);
  THEMES.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t.nom;b.dataset.t=t.code;b.setAttribute("aria-pressed","false");b.onclick=()=>{fTheme=fTheme===t.code?null:t.code;actualiser()};$("#themes").appendChild(b)});
  const reset=document.createElement("button");reset.className="reset";reset.textContent="Tout afficher";reset.onclick=()=>{fZone=null;fTheme=null;actualiser()};$("#themes").appendChild(reset);
}

function setZone(c){fZone=fZone===c?null:c;actualiser()}
document.addEventListener("click",e=>{if(e.target.id==="plus")afficherPlus()});

// ---------- affichage ----------
function dessinerCarte(syn){
  const maxN=Math.max(1,...Object.values(syn.zones).map(z=>z.total));
  ZONES.forEach(z=>{
    const {total:n=0,nouveaux:nw=0}=syn.zones[z.code]||{};
    const g=svg.querySelector(`[data-z="${z.code}"]`);
    g.dataset.h=n===0?0:Math.max(1,Math.ceil(4*n/maxN));
    g.classList.toggle("sel",fZone===z.code);
    g.setAttribute("aria-pressed",fZone===z.code);
    g.setAttribute("aria-label",`${z.nom} : ${n} information${n>1?"s":""}, dont ${nw} nouvelle${nw>1?"s":""}`);
    const T=z.tag; T.n.textContent=n; T.t.textContent=z.court||z.nom; T.nw.textContent=nw?`● ${nw}`:"";
  });
  placerEtiquettes();
  svg.classList.toggle("hasSel",!!fZone);
  document.querySelectorAll("#themes .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===fTheme));
  document.querySelectorAll("#zonelist .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.z===fZone));
  $("#maj").textContent=syn.mise_a_jour?fmtH(syn.mise_a_jour):"aucune collecte";
  $("#srcs").textContent=syn.sources.join(", ")||"aucune";
}

// Largeur des étiquettes : dépend des polices, donc à recalculer quand elles arrivent.
// Pur calcul de géométrie, aucune requête réseau.
function placerEtiquettes(){
  ZONES.forEach(z=>{
    const T=z.tag; if(!T)return;
    let x=8; T.n.setAttribute("x",x); x+=T.n.getComputedTextLength()+6;
    T.t.setAttribute("x",x); const tl=T.t.getComputedTextLength(); if(tl)x+=tl+6;
    T.nw.setAttribute("x",x); const nl=T.nw.getComputedTextLength(); if(nl)x+=nl+6;
    T.rect.setAttribute("width",x+2);
    const [ex,ey]=z.etiquette||[0,0];
    T.g.setAttribute("transform",`translate(${ex-(x+2)/2},${ey})`);
  });
}

const ligne=i=>`<li>
    ${i.nouveau?'<span class="badge">Nouveau</span>':""}
    <h3>${esc(i.titre)}</h3>
    <div class="meta"><span>${esc(i.source)}</span><span>${fmtH(i.date)}</span><span>${esc(zNom(i.zone))}</span><span>${esc(tNom(i.theme))}</span><a href="${esc(i.lien)}" target="_blank" rel="noopener">Lire l'article ↗</a></div>
  </li>`;
let affiches=0, totalFil=0;
function bouton(){const reste=totalFil-affiches;return reste>0?`<li class="more"><button class="chip" id="plus">Afficher ${Math.min(PAS,reste)} de plus (${reste} restantes)</button></li>`:""}

function dessinerFil(res){
  totalFil=res.total; affiches=res.articles.length;
  $("#ftitle").textContent=(fZone?zNom(fZone):"Toutes les zones")+(fTheme?" · "+tNom(fTheme):"");
  $("#fcount").textContent=`${res.total} information${res.total>1?"s":""} · ${res.nouveaux} nouvelle${res.nouveaux>1?"s":""}`;
  $("#list").innerHTML=res.articles.length?res.articles.map(ligne).join("")+bouton()
    :`<li class="empty">Aucune information pour ce filtre. Utilisez « Tout afficher » pour revenir à la vue générale.</li>`;
}

async function afficherPlus(){
  const b=$("#plus"); if(b){b.disabled=true;b.textContent="Chargement…"}
  try{
    const res=await api("articles",{zone:fZone,theme:fTheme,limite:PAS,decalage:affiches});
    affiches+=res.articles.length;
    $(".more")?.remove();
    $("#list").insertAdjacentHTML("beforeend",res.articles.map(ligne).join("")+bouton());
  }catch(e){erreur(e)}
}

function erreur(e){
  $("#list").innerHTML=`<li class="empty">Le serveur MAP ne répond pas (${esc(e.message)}).<br>Lancez-le avec <code>uv run uvicorn serveur.app:app</code> puis ouvrez http://localhost:8000.</li>`;
  $("#maj").textContent="—";
}

async function actualiser(){
  const n=++requete;
  $("#list").setAttribute("aria-busy","true");
  try{
    const [syn,res]=await Promise.all([api("synthese",{theme:fTheme}),api("articles",{zone:fZone,theme:fTheme,limite:PAS})]);
    if(n!==requete)return;          // une requête plus récente a été lancée entre-temps
    dessinerCarte(syn); dessinerFil(res);
  }catch(e){ if(n===requete)erreur(e) }
  finally{ $("#list").removeAttribute("aria-busy") }
}

(async()=>{
  $("#list").innerHTML='<li class="empty">Chargement des actualités…</li>';
  try{ construire(await api("referentiel")); }catch(e){ erreur(e); return; }
  await actualiser();
  // les polices changent la largeur du texte : on replace les étiquettes, sans
  // redemander les données (ce rappel coûtait 2 appels API et 32 Kio par visite)
  if(document.fonts)document.fonts.ready.then(placerEtiquettes);
})();
</script>
</body>
</html>
