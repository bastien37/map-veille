<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAP – Carte de veille</title>
<!-- Polices chargées sans bloquer le rendu : media="print" puis bascule à onload. Les piles
     de repli système (voir --display, --body, --mono) s'affichent en attendant. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>
/* Layout : tableau de situation — carte des 6 zones à gauche, fil filtré à droite ; empilé sur téléphone */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#14213a; --muted:#5b6679; --line:#d5dbe3;
  --land:#dfe4ea; --amas2:#4f73b3; --amas3:#1f4690;
  --accent:#1f4690; --new:#c2410c; --newbg:#fff1e8; --sea:#f7f9fb;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --panel:#161e2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2a3447;
  --land:#232d40; --amas2:#4b78c4; --amas3:#86a8e6;
  --accent:#86a8e6; --new:#fb9a5b; --newbg:#3a2316; --sea:#121a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --panel:#161e2e; --ink:#e6ebf3; --muted:#9aa6ba; --line:#2a3447;
  --land:#232d40; --amas2:#4b78c4; --amas3:#86a8e6;
  --accent:#86a8e6; --new:#fb9a5b; --newbg:#3a2316; --sea:#121a28; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{font-weight:500;color:var(--muted);font-size:1.15rem;letter-spacing:.04em;display:block;margin-top:4px;text-transform:uppercase}
.status{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.status b{color:var(--ink);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:focus-visible,.reset:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.bandeau{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;font-size:.85rem;color:var(--accent)}
/* cibles tactiles : au moins 24 px de haut (WCAG 2.2, 2.5.8). Les marges négatives
   compensent le remplissage pour que la mise en page ne bouge pas. */
.lien-theme{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;align-self:center;padding:4px 6px;margin:0 6px 0 -4px;
  display:inline-flex;align-items:center;min-height:24px}
.lien-theme:hover,.lien-theme:focus-visible{color:var(--accent)}
.reset{font:inherit;font-size:.85rem;font-weight:600;background:none;border:none;color:var(--accent);cursor:pointer;padding:5px 4px;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
/* carte à points */
.carte{height:min(68vh,640px);min-height:340px;border-radius:4px;background:var(--land);z-index:0}
.carte:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.etat{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--muted);min-height:1.2em}
.leaflet-container{font:inherit;background:var(--land)}
.leaflet-popup-content-wrapper,.leaflet-control-attribution{background:var(--panel);color:var(--ink)}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--bg)}
.agregat div{width:36px;height:36px;margin:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--panel);font-family:var(--display);font-weight:700;border:2px solid var(--panel)}
.agregat-moyen div{width:42px;height:42px;background:var(--amas2)}
.agregat-grand div{width:50px;height:50px;background:var(--amas3);font-size:1.05rem}
/* panneau des sources d'un événement */
#panneau{border-bottom:1px solid var(--line);background:var(--bg)}
.panneau-tete{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.panneau-tete h3{font-family:var(--display);font-size:1.15rem;margin:0;flex:1 1 auto}
.panneau-tete p{margin:0;font-family:var(--mono);font-size:.76rem;color:var(--muted);flex:1 1 100%}
.sources{list-style:none;margin:0;padding:0;max-height:46vh;overflow-y:auto}
.sources li{padding:10px 16px;border-top:1px solid var(--line)}
.sources h4{font-size:.94rem;font-weight:600;margin:0 0 3px;line-height:1.35}
.lien-evenement{font:inherit;font-size:.72rem;font-family:var(--mono);background:none;border:none;
  color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  display:inline-flex;align-items:center;min-height:24px;padding:3px 2px;margin-block:-3px}
.lien-evenement:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;max-height:720px}
.feedhead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.feedhead h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:.02em}
.feedhead p{margin:0;font-size:.82rem;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;overflow-y:auto}
li{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
li:last-child{border-bottom:none}
.badge{align-self:flex-start;font-family:var(--mono);font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--new);background:var(--newbg);padding:1px 6px;border-radius:3px}
li h3{font-size:.98rem;font-weight:600;margin:0;line-height:1.35}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.meta a{color:var(--accent);display:inline-flex;align-items:center;min-height:24px;padding-block:3px;margin-block:-3px}
.more{align-items:center}
.empty code{font-family:var(--mono);font-size:.85em}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
footer{font-size:.78rem;color:var(--muted);max-width:75ch}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .carte{height:56vh;min-height:300px}
  .sources{max-height:none}
  .feed{max-height:none}
  h1{font-size:2rem}
  .status{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>MAP<span>Monitoring de l'Actualité Planétaire</span></h1>
    <div class="status">
      <span>Dernière mise à jour : <b id="maj"></b></span>
    </div>
  </header>

  <div class="bar" id="vues">
    <span class="lbl" id="lbl-vue">Vue</span>
    <button class="chip" data-vue="points" aria-pressed="true">Carte</button>
    <button class="chip" data-vue="liste" aria-pressed="false">Liste seule</button>
    <span class="lbl" id="lbl-periode">Période</span>
    <button class="chip" data-jours="1" aria-pressed="false">24 h</button>
    <button class="chip" data-jours="7" aria-pressed="false">7 jours</button>
    <button class="chip" data-jours="30" aria-pressed="true">30 jours</button>
  </div>

  <div class="bar" id="themes"><span class="lbl">Thèmes</span></div>
  <p class="bandeau" id="bandeau-theme" hidden></p>

  <div class="grid">
    <section class="mapbox" id="mapbox" aria-label="Carte">
      <div class="carte" id="carte-points" tabindex="0"></div>
      <p class="etat" id="carte-etat" role="status" aria-live="polite"></p>
    </section>

    <section class="feed" aria-live="polite">
      <div class="feedhead">
        <h2 id="ftitle">Toute l'actualité</h2>
        <p id="fcount"></p>
      </div>
      <div id="panneau" hidden></div>
      <ol id="list"></ol>
    </section>
  </div>

  <footer id="foot">Sources : <span id="srcs"></span>. Seuls le titre, la source, la date et le lien de chaque article sont repris ; l'article complet s'ouvre sur le site du média.</footer>
</div>

<script>
// Aucune donnée dans ce fichier : zones, thèmes, tracé de la carte et actualités viennent de l'API.
// Racine du site. La page est servie telle quelle sur « / » comme sur « /theme/eco » :
// sans cela, « api/articles » deviendrait « /theme/api/articles ». Le calcul marche aussi
// si le site est installé dans un sous-répertoire.
const RACINE = location.pathname.replace(/theme\/[a-z0-9]+\/?$/, "");
const API = RACINE + "api";   // même serveur que la page (voir serveur/app.py)
const PAS=150;
// la zone reste en base et dans l'administration, mais ne sert plus de filtre public :
// la carte à points la remplace (voir bancs/DECISION-phase2.md, § 5)
let THEMES=[], CARTE=null, fJours=30, limite=PAS, requete=0;
let fThemes=[];            // thèmes cochés par le visiteur ; vide = tous
let pageTheme=null;        // code du thème si on est sur /theme/<code>
const CLE_THEMES="map.themes";
let vue="points";          // points | zones | liste
let carte=null;            // module site/carte.js, importé à la première vue « points »
const $=s=>document.querySelector(s);
const fmtH=d=>new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tNom=c=>(THEMES.find(t=>t.code===c)||{nom:c}).nom;
// paramètre « themes » de l'API : la liste cochée, ou rien du tout si elle est vide
const paramThemes=()=>pageTheme?pageTheme:(fThemes.length?fThemes.join(","):null);

// Mémoire locale des préférences. Peut échouer (navigation privée, stockage bloqué) :
// le site doit alors marcher pareil, simplement sans se souvenir.
function lireMemoire(cle, defaut){
  try{ const v=localStorage.getItem(cle); return v==null?defaut:JSON.parse(v) }catch{ return defaut }
}
function ecrireMemoire(cle, valeur){ try{ localStorage.setItem(cle,JSON.stringify(valeur)) }catch{} }

async function api(chemin, params={}){
  const q=new URLSearchParams(Object.entries(params).filter(([,v])=>v!=null&&v!==""));
  const r=await fetch(`${API}/${chemin}${q.size?"?"+q:""}`);
  if(!r.ok){let m="HTTP "+r.status;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}
  return r.json();
}

// ---------- construction depuis le référentiel ----------
function construire(ref){
  THEMES=ref.themes; CARTE=ref.carte;
  THEMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=t.nom; b.dataset.t=t.code;
    b.title=`Afficher ou masquer « ${t.nom} »`;
    b.onclick=()=>basculerTheme(t.code);
    $("#themes").appendChild(b);
    const a=document.createElement("a");
    a.className="lien-theme"; a.href=`${RACINE}theme/${t.code}`; a.textContent="page";
    a.title=`Page dédiée au thème « ${t.nom} »`;
    a.onclick=e=>{e.preventDefault();ouvrirPageTheme(t.code)};
    $("#themes").appendChild(a);
  });
  const reset=document.createElement("button");
  reset.className="reset"; reset.textContent="Tous les thèmes";
  reset.onclick=()=>{fThemes=[];ecrireMemoire(CLE_THEMES,fThemes);if(pageTheme)ouvrirPageTheme(null);else majThemes()};
  $("#themes").appendChild(reset);
  marquerThemes();
}

// ---------- bascule carte / liste ----------
// Le module de carte et Leaflet ne sont téléchargés qu'à la première ouverture de la vue
// carte : un visiteur qui reste sur la liste ne paie pas ces 60 Kio.
async function setVue(v){
  vue=v;
  document.querySelectorAll("#vues .chip[data-vue]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.vue===v));
  $("#mapbox").hidden = v==="liste";
  if(v!=="points"){ fermerPanneau(); return; }
  try{
    if(!carte){
      $("#carte-etat").textContent="Chargement de la carte…";
      carte=await import(`${RACINE}carte.js`);
      await carte.creer($("#carte-points"), CARTE, {surSelection:ouvrirEvenement, racine:RACINE});
    }
    carte.appliquerFiltres({themes:paramThemes(), jours:fJours});
    carte.invalider();     // le conteneur était caché : Leaflet doit remesurer
  }catch(e){
    $("#carte-etat").textContent="La carte n'a pas pu être chargée ; la liste reste disponible.";
    carte=null;
  }
}

// ---------- thèmes : le visiteur coche ceux qu'il veut, et son choix est gardé ----------
function basculerTheme(code){
  if(pageTheme)return ouvrirPageTheme(code===pageTheme?null:code);
  fThemes = fThemes.includes(code) ? fThemes.filter(c=>c!==code) : [...fThemes, code];
  ecrireMemoire(CLE_THEMES, fThemes);
  majThemes();
}
function majThemes(){
  marquerThemes();
  if(carte)carte.appliquerFiltres({themes:paramThemes()});
  actualiser();
}
function marquerThemes(){
  document.querySelectorAll("#themes .chip").forEach(b=>{
    const choisi = pageTheme ? b.dataset.t===pageTheme : fThemes.includes(b.dataset.t);
    b.setAttribute("aria-pressed", choisi);
  });
  const tousVisibles = !pageTheme && !fThemes.length;
  $("#bandeau-theme").hidden = !pageTheme;
  if(pageTheme)$("#bandeau-theme").textContent=`Page du thème « ${tNom(pageTheme)} »`;
  document.title = pageTheme ? `${tNom(pageTheme)} – MAP` : "MAP – Carte de veille";
  $("#themes .reset").hidden = tousVisibles;
}

// Page d'un thème : une adresse propre, partageable, sans rechargement.
function ouvrirPageTheme(code){
  pageTheme = code;
  history.pushState({theme:code}, "", code ? `${RACINE}theme/${code}` : RACINE);
  majThemes();
}
addEventListener("popstate", e=>{ pageTheme = e.state?.theme ?? lirePageTheme(); majThemes() });
function lirePageTheme(){
  const m = location.pathname.match(/\/theme\/([a-z0-9]+)\/?$/);
  return m ? m[1] : null;
}

function setJours(j){
  fJours=j;
  document.querySelectorAll("#vues .chip[data-jours]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.jours===j));
  ecrireMemoire("map.jours", j);
  if(carte)carte.appliquerFiltres({jours:j});
  actualiser();
}

// ---------- panneau des sources d'un événement ----------
async function ouvrirEvenement(id){
  const p=$("#panneau");
  p.hidden=false; p.innerHTML='<div class="panneau-tete"><h3>Chargement…</h3></div>';
  try{
    const e=await carte.chargerEvenement(id);
    p.innerHTML=carte.htmlPanneau(e);
    p.querySelector("#fermer-panneau")?.focus();
  }catch(err){
    p.innerHTML=`<div class="panneau-tete"><h3>Sources indisponibles</h3>
      <p>${esc(err.message)}</p><button class="chip" id="fermer-panneau">Fermer</button></div>`;
  }
}
function fermerPanneau(){const p=$("#panneau");p.hidden=true;p.innerHTML=""}

document.addEventListener("click",e=>{
  if(e.target.id==="plus")afficherPlus();
  if(e.target.id==="fermer-panneau")fermerPanneau();
  if(e.target.dataset?.vue)setVue(e.target.dataset.vue);
  if(e.target.dataset?.jours)setJours(+e.target.dataset.jours);
  if(e.target.classList?.contains("lien-evenement"))ouvrirEvenement(+e.target.dataset.evt);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#panneau").hidden)fermerPanneau()});

// ---------- affichage ----------
function dessinerEnTete(syn){
  $("#maj").textContent=syn.mise_a_jour?fmtH(syn.mise_a_jour):"aucune collecte";
  $("#srcs").textContent=syn.sources.join(", ")||"aucune";
}

const ligne=i=>`<li>
    ${i.nouveau?'<span class="badge">Nouveau</span>':""}
    <h3>${esc(i.titre)}</h3>
    <div class="meta"><span>${esc(i.source)}</span><span>${fmtH(i.date)}</span>${
      i.lieu?`<span>${esc(i.lieu)}</span>`:""}<span>${esc(tNom(i.theme))}</span>${
      i.nb_sources>1?`<button class="lien-evenement" data-evt="${i.evenement_id}">${i.nb_sources} sources</button>`:""
      }<a href="${esc(i.lien)}" target="_blank" rel="noopener">Lire l'article ↗</a></div>
  </li>`;
let affiches=0, totalFil=0;
function bouton(){const reste=totalFil-affiches;return reste>0?`<li class="more"><button class="chip" id="plus">Afficher ${Math.min(PAS,reste)} de plus (${reste} restantes)</button></li>`:""}

function dessinerFil(res){
  totalFil=res.total; affiches=res.articles.length;
  $("#ftitle").textContent = pageTheme ? tNom(pageTheme)
    : fThemes.length===1 ? tNom(fThemes[0])
    : fThemes.length ? `${fThemes.length} thèmes` : "Toute l'actualité";
  $("#fcount").textContent=`${res.total} événement${res.total>1?"s":""} · `
    +`${res.nouveaux} nouveau${res.nouveaux>1?"x":""}`
    +(res.total_articles>res.total?` · ${res.total_articles} articles`:"");
  $("#list").innerHTML=res.articles.length?res.articles.map(ligne).join("")+bouton()
    :`<li class="empty">Aucune information pour ce filtre. Utilisez « Tout afficher » pour revenir à la vue générale.</li>`;
}

async function afficherPlus(){
  const b=$("#plus"); if(b){b.disabled=true;b.textContent="Chargement…"}
  try{
    const res=await api("articles",{themes:paramThemes(),jours:fJours,limite:PAS,decalage:affiches});
    affiches+=res.articles.length;
    $(".more")?.remove();
    $("#list").insertAdjacentHTML("beforeend",res.articles.map(ligne).join("")+bouton());
  }catch(e){erreur(e)}
}

function erreur(e){
  $("#list").innerHTML=`<li class="empty">Le serveur MAP ne répond pas (${esc(e.message)}).<br>Lancez-le avec <code>uv run uvicorn serveur.app:app</code> puis ouvrez http://localhost:8000.</li>`;
  $("#maj").textContent="—";
}

async function actualiser(){
  const n=++requete;
  $("#list").setAttribute("aria-busy","true");
  try{
    const [syn,res]=await Promise.all([api("synthese",{themes:paramThemes(),jours:fJours}),
                                      api("articles",{themes:paramThemes(),jours:fJours,limite:PAS})]);
    if(n!==requete)return;          // une requête plus récente a été lancée entre-temps
    dessinerEnTete(syn); dessinerFil(res);
  }catch(e){ if(n===requete)erreur(e) }
  finally{ $("#list").removeAttribute("aria-busy") }
}

// ---------- mises à jour sans recharger la page ----------
// Un signal suffit : le serveur dit « une collecte vient de finir », le navigateur
// redemande ce qu'il affiche, avec SES filtres. Si le flux d'événements ne passe pas
// (proxy qui coupe, réseau capricieux), on retombe sur une interrogation légère.
const PERIODE_REPLI = 120000;
let replDirect = null;

function suivreEnDirect(){
  let flux;
  try{ flux = new EventSource(`${API}/direct`); }catch{ return replierSurInterrogation() }
  let vivant = false;
  flux.addEventListener("bonjour", ()=>{ vivant = true; clearInterval(replDirect); replDirect = null });
  flux.addEventListener("collecte", async e=>{
    let d={}; try{ d = JSON.parse(e.data) }catch{}
    $("#maj").textContent = d.mise_a_jour ? fmtH(d.mise_a_jour) : $("#maj").textContent;
    await actualiser();
    if(carte)carte.rafraichir();
  });
  flux.onerror = ()=>{ if(!vivant) replierSurInterrogation() };
  // si rien n'arrive dans les 15 premières secondes, le flux ne passe pas
  setTimeout(()=>{ if(!vivant)replierSurInterrogation() }, 15000);
}

function replierSurInterrogation(){
  if(replDirect)return;
  replDirect = setInterval(()=>{ if(!document.hidden)actualiser() }, PERIODE_REPLI);
}

(async()=>{
  $("#list").innerHTML='<li class="empty">Chargement des actualités…</li>';
  pageTheme = lirePageTheme();
  fThemes = lireMemoire(CLE_THEMES, []);
  fJours = lireMemoire("map.jours", 30);
  try{ construire(await api("referentiel")); }catch(e){ erreur(e); return; }
  fThemes = fThemes.filter(c=>THEMES.some(t=>t.code===c));   // un thème peut avoir disparu
  marquerThemes();
  document.querySelectorAll("#vues .chip[data-jours]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.jours===fJours));
  await actualiser();
  setVue("points");
  suivreEnDirect();
})();
